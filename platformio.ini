; ============================================================================
; imgshow — PlatformIO 配置
;
; Arduino IDE 用户不用管这个文件，看 README 的「Arduino IDE」一节。
;
; 关键点: board_build.partitions = no_ota.csv
;   = 2MB APP + 2MB SPIFFS/LittleFS，对应 Arduino IDE 里的
;     "No OTA (2MB APP/2MB SPIFFS)"。默认分区(1.2MB APP)装不下这个固件。
; ============================================================================
[platformio]
src_dir  = imgshow
data_dir = data

[env:esp32dev]
platform  = espressif32@^6.9.0     ; 6.x 对应 arduino-esp32 2.0.x(实测 2.0.9 通过)
                                   ; 想上 core 3.x 换成:
                                   ; platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
                                   ; 代码里已经用 ESP_ARDUINO_VERSION_MAJOR 做了 2.x/3.x 兼容
board     = esp32dev
framework = arduino

board_build.partitions = no_ota.csv
board_build.filesystem = littlefs

; /img 和 /vid 等素材可放在 data/，pio run -t uploadfs 时打包

monitor_speed  = 115200
upload_speed   = 921600
monitor_filters = esp32_exception_decoder

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -Wno-unused-variable
  -Wno-unused-function

lib_deps =
  adafruit/Adafruit GFX Library@^1.12.6
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
  adafruit/Adafruit BusIO@^1.17.0
  bblanchon/ArduinoJson@^7.4.3
